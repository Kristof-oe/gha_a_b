name: Docker to ecr

on:
    push:
        branches: [main]  
    pull_request:
        branches: [main]  

env:
    REGISTRY: "362099375729.dkr.ecr.eu-central-1.amazonaws.com"
    IMAGE1: sa
    IMAGE2: sb
    TAGES: ${{ github.sha }}

jobs:
    Display:
        runs-on: ubuntu-latest
        steps:
        - name: Check sha
          run: echo "this is sha ${{env.TAGES}}"

    Build:
        needs: Display
        runs-on: ubuntu-latest
        steps:
        - name: Checkout
          uses: actions/checkout@v4
          
        - name: Login to ECR
          uses: docker/login-action@v4
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ secrets.ACCESS_KEY }}
            password: ${{ secrets.SECRET_KEY }}

        - name: Build and push A
          uses: docker/build-push-action@v7
          with:
            context: app/sa/
            push: true
            tags: ${{ env.REGISTRY}}/${{env.IMAGE1}}:${{env.TAGES}}

        - name: Build and push B
          uses: docker/build-push-action@v7
          with:
            context: app/sb/
            push: true
            tags: ${{ env.REGISTRY}}/${{env.IMAGE2}}:${{env.TAGES}}




    